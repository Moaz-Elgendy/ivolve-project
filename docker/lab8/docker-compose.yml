name: application-mysql

services:
  application:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - DB_USER=mysql
      - DB_PASSWORD=mysql

    volumes:
      - application-volume:/app/logs

    networks:
      - ivolve-net

    ports:
     - 3000:3000

    depends_on:
      database:
        condition: service_started

  database:
    image: mysql:8.4

    environment:
      - MYSQL_DATABASE=ivolve
      - MYSQL_USER=mysql
      - MYSQL_PASSWORD=mysql
      - MYSQL_ROOT_PASSWORD=root

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - ivolve-net

volumes:
  db_data:
  application-volume:

networks:
  ivolve-net:
    driver: bridge
    ipam:
      config:
       - subnet: 192.168.10.0/24
