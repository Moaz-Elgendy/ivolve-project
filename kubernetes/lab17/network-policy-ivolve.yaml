apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ivolve-policy
  namespace: ivolve
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes:
    - Ingress
  ingress:
    - from:
      - podSelector:
          matchLabels:
            app: ivolve-app
      ports:
       - protocol: TCP
         port: 3306    
  
