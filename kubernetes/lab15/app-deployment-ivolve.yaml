apiVersion: apps/v1
kind: Deployment
metadata:
  name: ivolve-app
  namespace: ivolve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ivolve-app

  template:
    metadata:
      labels:
        app: ivolve-app
    spec:
      imagePullSecrets:
        - name: docker-hub-secret
      nodeSelector:
        project: ivolve
      tolerations:
        - key: workload
          operator: Equal
          value: ivolveApp
          effect: NoSchedule
      initContainers:
        - name: init-mysql
          image: mysql
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ivolve-cm
                  key: DB_HOST
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ivolve-secret
                  key: MY_SQL_ROOT_PASSWORD
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: ivolve-cm
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
               secretKeyRef:
                 name: ivolve-secret 
                 key: DB_PASSWORD      
            - name: DB_PORT
              value: "3306"
          command:
            - /bin/sh
            - -ec
          args:
            - |
              export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"
              echo "Waiting for MYSQL ..." 
              until mysql \
                -h "$DB_HOST" \
                -P "$DB_PORT" \
                -u root \
                -e "SELECT 1" >/dev/null 2>&1; do
                sleep 5
              done
            
              echo "MYSQL is ready!"
              echo "Creating ivolve  Database ..."
              mysql \
                -h "$DB_HOST" \
                -P "$DB_PORT" \
                -u root <<SQL
              CREATE DATABASE IF NOT EXISTS ivolve;
            
              GRANT ALL PRIVILEGES ON ivolve.*
              TO 'ivolve'@'%';
              SQL
              echo "Database initialized successfully"
        
      containers:
      - image: mk0230/application-ivolve:13
        name: application-ivolve
        ports:
          - containerPort: 3000
        env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: ivolve-cm
                key: DB_HOST
          - name: MYSQL_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ivolve-secret
                key: MY_SQL_ROOT_PASSWORD
          - name: DB_USER
            valueFrom:
              configMapKeyRef:
                name: ivolve-cm
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
                secretKeyRef:
                  name: ivolve-secret
                  key: DB_PASSWORD
        volumeMounts:
          - name: application-volume
            mountPath: /app/logs         
        resources: {}    
      volumes:
        - name: application-volume
          persistentVolumeClaim:
            claimName: application-ivolve-pvc 
status: {}
