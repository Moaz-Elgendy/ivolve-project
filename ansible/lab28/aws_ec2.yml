---
plugin: amazon.aws.aws_ec2
regions:
  - us-east-1
filters:
  tag:server: ivolve
  instance-state-name: running
keyed_groups:
  - key: tags.server
    prefix: server
    separator: "_"
hostnames:
  - tag:Name
compose:
  ansible_host: public_ip_address
  ansible_user: "'ubuntu'"
  ansible_ssh_private_key_file: "'~/.ssh/ivolve-lab28.pem'"
